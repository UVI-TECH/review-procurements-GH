{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block contenido %}
<section class="entrada" aria-labelledby="titulo-entrada">
  <h1 id="titulo-entrada">Entrar</h1>
  <p class="nota">Acceso solo para personal autorizado de Gestión Humana.</p>
  {% if form.errors %}
    <p class="mensaje mensaje-error" role="alert" aria-live="assertive">Usuario o contraseña incorrectos.</p>
  {% endif %}
  <form method="post" action="{% url 'login' %}" class="formulario">
    {% csrf_token %}
    <label for="id_username">Usuario</label>
    <input type="text" name="username" id="id_username" autocomplete="username" required autofocus value="{{ form.username.value|default:'' }}">
    <label for="id_password">Contraseña</label>
    <input type="password" name="password" id="id_password" autocomplete="current-password" required>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="boton boton-principal">Entrar</button>
  </form>
</section>
{% endblock %}
