# Instalar los hooks una vez por clon:  uv run pre-commit install
# La versión de gitleaks (rev) es la misma que usa el job de CI; se lee de aquí.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
