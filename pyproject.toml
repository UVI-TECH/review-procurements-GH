[project]
name = "revision-contrataciones"
version = "0.1.0"
description = "Revisión de documentos de contratación de Gestión Humana (UNIAJC)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.1.0",
    "django>=5.2,<5.3",
    "django-environ>=0.14.0",
    "openpyxl>=3.1.5",
    "pypdf[crypto]>=6.21.2",
    "waitress>=3.0.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest-django>=4.14.0",
    "pytest-playwright>=0.10.0",
    "ruff>=0.17.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["legado", "**/migrations"]
# Respeta las exclusiones aunque pre-commit pase los archivos uno a uno.
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.pruebas"
testpaths = ["tests"]
# Las pruebas de navegador (Chromium) solo corren en CI: uv run pytest -m navegador.
addopts = "-ra -m 'not navegador'"
markers = ["navegador: Playwright con Chromium real; solo en CI (job Navegador)"]
